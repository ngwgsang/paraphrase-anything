name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite
        run: python -m unittest discover -s tests

      - name: Verify zero-install CLI help
        run: python skills/paraphrase-anything/scripts/pe.py --help

      - name: Verify zero-install CLI end-to-end
        shell: bash
        run: |
          python skills/paraphrase-anything/scripts/pe.py check --original-text "Team had 42 members in 2024." --rewritten-text "In 2024, the team comprised 42 members."
          python skills/paraphrase-anything/scripts/pe.py metrics --original-text "Original phrase here." --rewritten-text "Rewritten phrase here." --mode standard
          python skills/paraphrase-anything/scripts/pe.py metrics --pairwise --variant "Alpha version" --variant "Beta version"
